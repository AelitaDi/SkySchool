version: "3.9"

services:
  web:
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/code
      - static_volume:/code/static
    ports:
      - "8000:8000"
    depends_on:
      - db
    env_file:
      - ./.env

  db:
    image: postgres:16
    volumes:
      - postgres_data:/var/lib/postgresql/data
    env_file:
      - ./.env
    healthcheck:
      test: [ "CMD-SHELL", "pg-isready -h db -U $POSTGRES_USER" ]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:latest

  celery:
    build: .
    command: celery -A config worker -l INFO -P eventlet
    volumes:
      - .:/code
    depends_on:
      - redis
      - db
      - web
    env_file:
      - .env

  celery-beat:
    build: .
    command: celery -A config beat -l INFO
    volumes:
      - .:/code
    depends_on:
      - redis
      - db
      - web
    env_file:
      - .env

volumes:
  postgres_data:
  static_volume:
