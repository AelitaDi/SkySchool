[tool.poetry]
name = "skyschool"
version = "0.1.0"
description = ""
authors = ["uliana rogova <uv.rogova@yandex.ru>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.12"
django = "^5.1.5"
pillow = "^11.1.0"
psycopg2-binary = "^2.9.10"
djangorestframework = "^3.15.2"
python-dotenv = "^1.0.1"
django-filter = "^24.3"
djangorestframework-simplejwt = "^5.4.0"
coverage = "^7.6.10"
drf-yasg = "^1.21.8"
stripe = "^11.5.0"
forex-python = "^1.8"
celery = "^5.4.0"
redis = "^5.2.1"
eventlet = "^0.39.0"
django-celery-beat = "^2.7.0"
gunicorn = "^23.0.0"
django-redis = "^5.4.0"


[tool.poetry.group.lint.dependencies]
black = "^24.10.0"
flake8 = "^7.1.1"
isort = "^5.13.2"

[tool.black]
line-length = 119
exclude = '.git'

[tool.isort]
line_length = 119

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
